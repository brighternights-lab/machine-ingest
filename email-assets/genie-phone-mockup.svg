<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c5c0"/>
      <stop offset="100%" stop-color="#c020a0"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="30" y="55" width="300" height="615" rx="18"/>
    </clipPath>
  </defs>
  <!-- Phone body -->
  <rect width="360" height="720" fill="#0a0a14"/>
  <rect x="18" y="8" width="324" height="704" rx="42" fill="#111111" stroke="#2a2a3a" stroke-width="2"/>
  <!-- Notch -->
  <rect x="128" y="8" width="104" height="22" rx="11" fill="#111111"/>
  <!-- Screen bg -->
  <rect x="30" y="55" width="300" height="615" rx="18" fill="#0d0d1a"/>
  <!-- Header bar -->
  <rect x="30" y="55" width="300" height="48" rx="18" fill="#1a1a2e" clip-path="url(#screen)"/>
  <rect x="30" y="75" width="300" height="28" fill="#1a1a2e"/>
  <text x="180" y="84" text-anchor="middle" fill="white" font-size="17" font-weight="bold" font-family="Arial, sans-serif">Genie ✦</text>
  <!-- Contractor bubble 1 -->
  <rect x="128" y="118" width="192" height="55" rx="14" fill="#00c896"/>
  <text x="140" y="135" fill="white" font-size="11" font-family="Arial">Whitaker house. 240 ft of</text>
  <text x="140" y="150" fill="white" font-size="11" font-family="Arial">roofline, 20 MR16 landscape</text>
  <text x="140" y="165" fill="white" font-size="11" font-family="Arial">uplights. Build me an estimate.</text>
  <!-- Genie response bubble -->
  <rect x="32" y="188" width="218" height="118" rx="14" fill="#1e1e2e"/>
  <text x="45" y="206" fill="#aaa" font-size="10" font-family="Arial">Got it. Here's the take-off:</text>
  <text x="45" y="222" fill="white" font-size="11" font-family="Arial">• Roofline 250ft kit — $3,100</text>
  <text x="45" y="238" fill="white" font-size="11" font-family="Arial">• MR16 12+8 pack — $3,400</text>
  <text x="45" y="254" fill="white" font-size="11" font-family="Arial">• Wi-Fi gateway — $270</text>
  <text x="45" y="274" fill="#00c896" font-size="12" font-weight="bold" font-family="Arial">Material cost: $6,770</text>
  <!-- Estimate card (white) -->
  <rect x="32" y="322" width="296" height="115" rx="12" fill="white" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.4))"/>
  <text x="48" y="344" fill="#00c896" font-size="12" font-weight="bold" font-family="Arial">ESTIMATE BNLT-1042</text>
  <text x="48" y="360" fill="#555" font-size="11" font-family="Arial">Whitaker Residence</text>
  <text x="48" y="378" fill="#333" font-size="11" font-family="Arial">Roofline Lighting ............. $7,000</text>
  <text x="48" y="394" fill="#333" font-size="11" font-family="Arial">Landscape Uplighting ........ $8,500</text>
  <line x1="42" y1="404" x2="320" y2="404" stroke="#e0e0e0" stroke-width="1"/>
  <text x="48" y="420" fill="#111" font-size="13" font-weight="bold" font-family="Arial">TOTAL ..................... $15,500</text>
  <!-- Bottom bubble right -->
  <rect x="112" y="452" width="208" height="45" rx="14" fill="#00c896"/>
  <text x="124" y="469" fill="white" font-size="10.5" font-family="Arial">Your margin is $8,730.</text>
  <text x="124" y="484" fill="white" font-size="10.5" font-family="Arial">Want it as PDF?</text>
  <!-- Bottom bubble left -->
  <rect x="32" y="512" width="192" height="30" rx="14" fill="#1e1e2e"/>
  <text x="46" y="531" fill="white" font-size="10.5" font-family="Arial">Yes — send to the homeowner.</text>
</svg>
